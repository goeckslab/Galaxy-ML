version: 2
jobs:
  build:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Build Dependencies
          command: |
            pip install -e .
            pip install flake8 pytest | cat; test ${PIPESTATUS[0]} -eq 0
            mkdir test-reports | cat
      - run:
          name: Flake8
          command: |
            flake8 . --statistics --show-source --ignore=F401,F821,I100,W503 -v
      - run:
          name: Run API Tests
          command: |
            cd ./galaxy_ml
            python -m pytest ./tests -sv
      - store_test_results:
          path: test-reports
  tool_lint:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - run:
          name: Tool Linter
          command: |
            # These legacy tools target Galaxy's 21.x lint rules. Keep their
            # lint environment independent from both the Python 3.12 package
            # and the newer Galaxy runtime used by the tool tests.
            pip install \
              "planemo==0.74.11" \
              "galaxy-tool-util==21.9.2" \
              "galaxy-util==21.9.0" \
              "pydantic==1.10.24" \
              "packaging==21.3" \
              "lxml==4.9.4"
            cd galaxy_ml/tools
            planemo lint
  tool_test:
    docker:
      - image: cimg/python:3.9
    parallelism: 4
    steps:
      - checkout
      - run:
          name: Build Environment
          command: |
            # This is the tool runtime, not the Python 3.12 package runtime.
            pip install \
              "planemo==0.75.34" \
              "galaxy-tool-util==25.1.2" \
              "galaxy-tool-util-models==25.1.2"
            if [[ ! -d ~/miniconda3 ]]; then
                wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh &&
                bash miniconda.sh -b -f -p ~/miniconda3;
            else
                echo "Using cached miniconda";
            fi
      - run:
          name: Tool Tests
          command: |
            cd galaxy_ml/tools
            TESTFILES=$(ls -I "*macros.xml" | grep .xml | circleci tests split)
            planemo test --galaxy_branch release_25.0 ${TESTFILES}
workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - tool_lint
      - tool_test
