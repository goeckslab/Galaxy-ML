name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  api-tests:
    name: Python lint and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install flake8 pytest
      - name: Flake8
        run: flake8 . --statistics --show-source --ignore=F401,F821,I100,W503 -v
      - name: Run API tests
        working-directory: galaxy_ml
        run: python -m pytest ./tests -sv
