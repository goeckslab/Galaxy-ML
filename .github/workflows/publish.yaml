name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example release_v0.11.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'goeckslab/Galaxy-ML'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release version and PyPI
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: python
        run: |
          import json
          import os
          from runpy import run_path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          version = run_path('galaxy_ml/__init__.py')['__version__']
          if os.environ['RELEASE_TAG'] != f'release_v{version}':
              raise SystemExit('Release tag must match the package version: '
                               f'release_v{version}')
          try:
              with urlopen(f'https://pypi.org/pypi/Galaxy-ML/{version}/json',
                           timeout=30) as response:
                  exists = bool(json.load(response)['urls'])
          except HTTPError as error:
              if error.code != 404:
                  raise
              exists = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={str(not exists).lower()}\n')
          message = (f'Galaxy-ML {version} is already on PyPI; skipping upload.'
                     if exists else f'Preparing Galaxy-ML {version} for PyPI.')
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message + '\n')
      - name: Build and check source distribution
        if: steps.check.outputs.publish == 'true'
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check --strict dist/*
          # Compile the Cython extensions from the actual release archive.
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir wheel-check
      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.publish == 'true'
        with:
          name: pypi-dist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/Galaxy-ML/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
